[package]
name = "elsewhere"
version = "0.2.0"
description = "Elsewhere. Externalized thought."
edition = "2021"

[lib]
name = "elsewhere_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
elsewhere-core = { path = "../core" }
serde_json.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
base64 = "0.22"
